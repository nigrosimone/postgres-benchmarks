name: Benchmark

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Several runs in parallel: GitHub assigns the CPU at random and the ranking depends on it
  benchmark:
    strategy:
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker compose build

      - name: Run benchmark
        run: |
          set -o pipefail
          mkdir -m 777 out
          docker compose run --rm -T -v "$PWD/out:/home/node/app/out" -e BENCH_JSON=out/result.json web | tee out/benchmark.txt

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.run }}
          path: out/

  # Separate job so the write token is never exposed to the benchmarked packages
  report:
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: runs

      - name: Aggregate runs
        run: |
          node aggregate.ts runs/* > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update README output
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          awk -v f=report.md '
            /<!-- benchmark:end -->/ { while ((getline l < f) > 0) print l; skip = 0 }
            !skip { print }
            /<!-- benchmark:start -->/ { skip = 1 }
          ' README.md > README.tmp
          mv README.tmp README.md
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update benchmark output" README.md
          git push
